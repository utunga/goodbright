<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>__TITLE__ — whole route on one page</title>
<style>
/*__LEAFLET_CSS__*/
</style>
<style>
:root{ --route:#e8590c; }
*{box-sizing:border-box}
body{margin:0;background:#9ca3af;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:#111}
#bar{position:sticky;top:0;z-index:50;background:#1f2a37;color:#fff;padding:10px 14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:14px}
#bar b{font-size:16px}
#bar select,#bar button{font-size:14px;padding:6px 10px;border-radius:8px;border:0}
#bar button{background:#0b6bcb;color:#fff;font-weight:700}
#bar button:disabled{background:#6b7280}
#bar a{color:#fff}
#wrap{padding:14px;overflow:auto}
#poster{background:#fff;margin:0 auto;position:relative;box-shadow:0 2px 12px rgba(0,0,0,.35);display:flex;flex-direction:column;overflow:hidden}
#head{display:flex;align-items:baseline;gap:5mm;padding:4mm 6mm 2mm;border-bottom:.4mm solid #111;flex:0 0 auto}
#head h1{margin:0;font-size:9mm;line-height:1}
#head .sub{font-size:4mm;color:#333}
#head .right{margin-left:auto;font-size:3.6mm;color:#333;text-align:right}
#body{display:flex;flex:1 1 auto;min-height:0}
#map{flex:1 1 auto;min-width:0;background:#eef}
#side{flex:0 0 auto;width:62mm;border-left:.3mm solid #111;padding:2.5mm 3mm;font-size:2.9mm;overflow:hidden}
#side table{width:100%;border-collapse:collapse}
#side td{padding:.7mm .8mm;border-bottom:.15mm solid #ddd;vertical-align:top;line-height:1.2}
#side td.n{font-weight:800;color:var(--route);text-align:right;width:6mm}
#side td.t{white-space:nowrap;text-align:right;font-variant-numeric:tabular-nums}
#side .sm{font-size:2.4mm;color:#666}
#side .legend{margin-top:2mm;font-size:2.6mm;color:#333;line-height:1.5}
.sw{display:inline-block;width:6mm;height:1mm;vertical-align:middle;margin-right:1mm}
#poster.portrait #body{flex-direction:column}
#poster.portrait #side{width:auto;border-left:0;border-top:.3mm solid #111;columns:2;column-gap:6mm;max-height:38%}
#poster.nomap-side #side{display:none}
.leaflet-container{font-family:inherit}
.leaflet-control-attribution{font-size:2.4mm}
.lbl{background:rgba(255,255,255,.95);border:.2mm solid #111;border-radius:1mm;padding:.3mm 1.1mm;font-size:2.8mm;font-weight:700;box-shadow:none;white-space:nowrap}
.leaflet-tooltip.lbl::before{display:none}
.lbl small{font-weight:600;color:#333}
.msdot{width:5.2mm;height:5.2mm;border-radius:50%;background:#fff;border:.55mm solid var(--route);color:#111;font-weight:800;font-size:2.9mm;display:flex;align-items:center;justify-content:center}
.msdot.finish{background:#111;color:#fff;border-color:#fff}
.poi{width:4.4mm;height:4.4mm;border-radius:.9mm;background:#fff;border:.35mm solid #0891b2;display:flex;align-items:center;justify-content:center}
.poi svg{width:3.2mm;height:3.2mm}
.lm{width:5mm;height:5mm;border-radius:.9mm;background:#fff;border:.35mm solid #374151;display:flex;align-items:center;justify-content:center}
.lm svg{width:3.6mm;height:3.6mm}
.north{position:absolute;right:4mm;top:4mm;z-index:700;width:9mm;text-align:center;font-size:2.8mm;font-weight:800;background:rgba(255,255,255,.85);border-radius:1mm;padding:.8mm 0}
.north svg{width:7mm;height:7mm;display:block;margin:0 auto}
#status{opacity:.9}
@media print{
  body{background:#fff}
  #bar{display:none}
  #wrap{padding:0;overflow:visible}
  #poster{margin:0;box-shadow:none}
  .leaflet-control-zoom{display:none}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
<style id="pageStyle"></style>
</head>
<body>
<div id="bar">
  <b>__TITLE__ — one page</b>
  <label>Size <select id="size">
    <option value="A4">A4</option><option value="A3" selected>A3</option><option value="A2">A2</option><option value="screen">1920 × 1080 screen</option>
  </select></label>
  <label>Orientation <select id="orient"><option value="landscape" selected>landscape</option><option value="portrait">portrait</option></select></label>
  <label>Map <select id="layer">
    <option value="osm" selected>Streets (OpenStreetMap)</option><option value="topo">LINZ Topo50</option><option value="sat">Satellite (LINZ aerial)</option><option value="satEsri">Satellite (Esri)</option><option value="otm">OpenTopoMap</option>
  </select></label>
  <label><input type="checkbox" id="showSide" checked> timetable</label>
  <label><input type="checkbox" id="showLabels" checked> labels</label>
  <span id="status">…</span>
  <button id="print" disabled>Print / Save as PDF</button>
  <button id="png" disabled>Save as PNG</button>
  <a href="./">← app</a> <a href="print.html">sheets</a>
</div>
<div id="wrap"><div id="poster">
  <div id="head"><h1>__TITLE__</h1><span class="sub" id="sub"></span><span class="right" id="facts"></span></div>
  <div id="body"><div id="map"></div><div id="side"></div></div>
</div></div>

<script src="data.js"></script>
<script>
/*__LEAFLET_JS__*/
</script>
<script>
(function(){
'use strict';
const W = window.WALK;
const LINZ_KEY = '__LINZ_KEY__';
const R = 6371008.8;
const $ = (id) => document.getElementById(id);
const SIZES = {A4:[297,210], A3:[420,297], A2:[594,420], screen:[508,285.75]}; // mm (screen = 1920×1080 px at 96 dpi)

const lat0 = W.route.reduce((s,p)=>s+p[0],0)/W.route.length*Math.PI/180;
const KX = R*Math.cos(lat0)*Math.PI/180, KY = R*Math.PI/180;
const toXY = (ll) => [ll[1]*KX, ll[0]*KY];
const XY = W.route.map(toXY);
const CUM = [0];
for (let i=1;i<XY.length;i++) CUM.push(CUM[i-1] + Math.hypot(XY[i][0]-XY[i-1][0], XY[i][1]-XY[i-1][1]));
const TOTAL = CUM[CUM.length-1];
function pointAt(along){
  if (along <= 0) return XY[0];
  if (along >= TOTAL) return XY[XY.length-1];
  let lo=0, hi=CUM.length-1;
  while (hi-lo>1){ const m=(lo+hi)>>1; if (CUM[m] <= along) lo=m; else hi=m; }
  const t = (along-CUM[lo])/((CUM[hi]-CUM[lo])||1);
  return [XY[lo][0] + t*(XY[hi][0]-XY[lo][0]), XY[lo][1] + t*(XY[hi][1]-XY[lo][1])];
}
const [nh, nm] = W.nominalStart.split(':').map(Number);
function fmtOffset(min){ let t = nh*60+nm+min; let h = Math.floor(t/60)%24, m = t%60; const ap = h>=12?'pm':'am'; h=h%12||12; return h + ':' + String(m).padStart(2,'0') + ap; }
function fmtClock(hm){ const [h0, m] = hm.split(':').map(Number); let h = h0; const ap = h>=12?'pm':'am'; h=h%12||12; return h + ':' + String(m).padStart(2,'0') + ap; }
const fmtKm = (m) => (m/1000).toFixed(1) + ' km';
const FINAL = W.milestones[W.milestones.length-1];

const SVG = {
  toilet: '<svg viewBox="0 0 24 24" fill="#0e7490"><circle cx="8" cy="4.5" r="2"/><path d="M6 8h4v6H9v7H7v-7H6z"/><circle cx="16.5" cy="4.5" r="2"/><path d="M14 8h5l1.5 7h-1.8l1 6h-4.4l1-6h-1.8z"/></svg>',
  view: '<svg viewBox="0 0 24 24" fill="#0e7490"><path d="M12 5C6.5 5 2.5 12 2.5 12s4 7 9.5 7 9.5-7 9.5-7-4-7-9.5-7zm0 11a4 4 0 110-8 4 4 0 010 8zm0-6a2 2 0 100 4 2 2 0 000-4z"/></svg>',
  school: '<svg viewBox="0 0 24 24" fill="#374151"><path d="M12 3 1 9l11 6 9-4.9V17h2V9L12 3zm-7 9.6V17c0 1.7 3.1 3 7 3s7-1.3 7-3v-4.4l-7 3.8-7-3.8z"/></svg>',
  tent: '<svg viewBox="0 0 24 24" fill="#fff"><path d="M12 3 2 20h20L12 3zm0 5 5.5 9.5h-3L12 13l-2.5 4.5h-3L12 8z"/></svg>',
};
const ATTR = {osm:'© OpenStreetMap contributors', topo:'Topo50 © LINZ CC BY 4.0', sat:'Aerial imagery © LINZ CC BY 4.0', satEsri:'Imagery © Esri, Maxar, Earthstar Geographics', otm:'© OpenStreetMap, SRTM | © OpenTopoMap CC BY-SA'};
function makeLayer(kind){
  const retina = {tileSize:128, zoomOffset:1, crossOrigin:'anonymous'};
  if (kind === 'topo') return L.tileLayer('https://tiles-{s}.data-cdn.linz.govt.nz/services;key=' + LINZ_KEY + '/tiles/v4/layer=50767/EPSG:3857/{z}/{x}/{y}.png', Object.assign({maxNativeZoom:15, maxZoom:18, subdomains:'abcd', attribution:ATTR.topo}, retina));
  if (kind === 'sat') return L.tileLayer('https://basemaps.linz.govt.nz/v1/tiles/aerial/WebMercatorQuad/{z}/{x}/{y}.webp', Object.assign({maxNativeZoom:19, maxZoom:20, attribution:ATTR.sat}, retina));
  if (kind === 'satEsri') return L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', Object.assign({maxNativeZoom:18, maxZoom:20, attribution:ATTR.satEsri}, retina));
  if (kind === 'otm') return L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', Object.assign({maxNativeZoom:15, maxZoom:18, subdomains:'abc', attribution:ATTR.otm}, retina));
  return L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', Object.assign({maxNativeZoom:18, maxZoom:19, attribution:ATTR.osm}, retina));
}

// label side: away from neighbouring milestones and the line through the point
const dirs = {right:[1,0], left:[-1,0], top:[0,1], bottom:[0,-1]};
function labelDir(i){
  const m = W.milestones[i], here = toXY([m.lat, m.lng]), others = [];
  for (const d of [-1, 1]){ const o = W.milestones[i+d]; if (o){ const p = toXY([o.lat,o.lng]); const v=[p[0]-here[0], p[1]-here[1]]; const L2=Math.hypot(v[0],v[1])||1; others.push([v[0]/L2, v[1]/L2]); } }
  for (const p of [pointAt(Math.max(0, m.along-80)), pointAt(Math.min(TOTAL, m.along+80))]){ const v=[p[0]-here[0], p[1]-here[1]]; const L2=Math.hypot(v[0],v[1])||1; if (L2>5) others.push([v[0]/L2, v[1]/L2]); }
  let bestDir = 'right', bestScore = -1e9;
  for (const [name, d] of Object.entries(dirs)){
    let worst = 1e9; for (const o of others) worst = Math.min(worst, -(d[0]*o[0] + d[1]*o[1]));
    const score = worst + (name === 'right' ? .01 : name === 'left' ? .005 : 0);
    if (score > bestScore){ bestScore = score; bestDir = name; }
  }
  return bestDir;
}
const labelText = (i) => { const m = W.milestones[i]; return {n: String(i), name: m.label, time: fmtOffset(m.offset) + (m.break ? ' · ' + m.break + ' min' : '')}; };

let map = null, tileLayer = null, pending = 0, loaded = false;
function setStatus(){
  $('status').textContent = loaded ? 'ready' : 'loading map tiles…';
  $('print').disabled = !loaded; $('png').disabled = !loaded;
}
function build(){
  const size = $('size').value, orient = $('orient').value, kind = $('layer').value;
  let [w, h] = SIZES[size]; if (orient === 'portrait') [w, h] = [h, w];
  const poster = $('poster');
  poster.style.width = w + 'mm'; poster.style.height = h + 'mm';
  poster.className = (orient === 'portrait' ? 'portrait' : '') + ($('showSide').checked ? '' : ' nomap-side');
  $('pageStyle').textContent = '@page{ size:' + (size === 'screen' ? '508mm 285.75mm' : size + ' ' + orient) + '; margin:0 }';
  // header
  $('sub').textContent = W.subtitle + ' · ' + fmtKm(TOTAL);
  $('facts').innerHTML = 'Leave <b>' + fmtOffset(0) + '</b> · due at ' + FINAL.label + ' <b>' + fmtOffset(FINAL.offset) + '</b>' + (W.deadline ? ' · be there by <b>' + fmtClock(W.deadline) + '</b>' : ' · ' + W.bufferMin + ' min buffer') + '<br><span style="font-size:2.8mm">Map: ' + ATTR[kind] + '</span>';
  // side table
  let rows = '';
  W.milestones.forEach((m, i) => {
    rows += '<tr><td class="n">' + (m.finish ? '⛺' : i) + '</td><td>' + m.label + (m.legNote ? '<div class="sm">' + m.legNote + '</div>' : '') + (m.break ? '<div class="sm">' + m.break + ' min' + (m.note ? ' — ' + m.note : '') + '</div>' : (m.note ? '<div class="sm">' + m.note + '</div>' : '')) + '</td><td class="t">' + fmtOffset(m.offset) + '<div class="sm">' + fmtKm(m.along) + '</div></td></tr>';
  });
  $('side').innerHTML = '<table>' + rows + '</table><div class="legend"><i class="sw" style="background:#e8590c"></i>route &nbsp; <i class="sw" style="background:#7c3aed"></i>joined by hand &nbsp; <i class="sw" style="background:#4b5563"></i>optional' + (W.pois.length ? ' &nbsp; <span class="poi" style="display:inline-flex;vertical-align:middle">' + (SVG[W.pois[0].kind]||'') + '</span> ' + (W.pois[0].kind === 'toilet' ? 'toilets' : 'points of interest') : '') + '<br>Times are planned arrivals, before any break.</div>';
  // map
  if (map){ map.remove(); map = null; }
  loaded = false; setStatus();
  map = L.map('map', {zoomControl:false, attributionControl:true, zoomSnap:0, zoomDelta:.1, dragging:true, scrollWheelZoom:true});
  tileLayer = makeLayer(kind).addTo(map);
  tileLayer.on('loading', () => { loaded = false; setStatus(); });
  tileLayer.on('load', () => { loaded = true; setStatus(); });
  const b = L.latLngBounds(W.route);
  map.fitBounds(b, {padding:[40, 40], animate:false});
  L.polyline(W.route, {color:'#fff', weight:8, opacity:.6, interactive:false}).addTo(map);
  L.polyline(W.route, {color:'#e8590c', weight:4, opacity:.85, interactive:false}).addTo(map);
  for (const [i,j] of W.bridges) L.polyline([W.route[i], W.route[j]], {color:'#7c3aed', weight:4, dashArray:'6 6'}).addTo(map);
  for (const ex of W.extras) L.polyline(ex.coords, {color:'#4b5563', weight:3, dashArray:'4 8'}).addTo(map);
  const labels = $('showLabels').checked;
  W.milestones.forEach((m, i) => {
    const mk = L.marker([m.lat, m.lng], {icon: L.divIcon({className:'', html:'<div class="msdot' + (m.finish?' finish':'') + '">' + (m.finish?SVG.tent:i) + '</div>', iconSize:[20,20], iconAnchor:[10,10]})}).addTo(map);
    if (labels){ const d = labelDir(i), t = labelText(i); mk.bindTooltip('<b>' + t.n + '</b> ' + t.name + ' <small>' + t.time + '</small>', {permanent:true, direction:d, className:'lbl', offset:{right:[11,0], left:[-11,0], top:[0,-11], bottom:[0,11]}[d]}).openTooltip(); }
  });
  for (const lm of W.landmarks){
    const mk = L.marker([lm.lat, lm.lng], {icon: L.divIcon({className:'', html:'<div class="lm">' + (SVG[lm.kind]||'') + '</div>', iconSize:[19,19], iconAnchor:[9,9]})}).addTo(map);
    if (labels) mk.bindTooltip(lm.label, {permanent:true, direction:'bottom', className:'lbl', offset:[0,9]}).openTooltip();
  }
  for (const p of W.pois){
    const mk = L.marker([p.lat, p.lng], {icon: L.divIcon({className:'', html:'<div class="poi">' + (SVG[p.kind]||'') + '</div>', iconSize:[17,17], iconAnchor:[8,8]})}).addTo(map);
    if (labels) mk.bindTooltip(p.label, {permanent:true, direction:'bottom', className:'lbl', offset:[0,8]}).openTooltip();
  }
  L.control.scale({metric:true, imperial:false, position:'bottomleft', maxWidth:200}).addTo(map);
  const n = document.createElement('div'); n.className = 'north'; n.innerHTML = '<svg viewBox="0 0 24 24"><path d="M12 2 6 20l6-4 6 4z" fill="#111"/></svg>N'; $('map').appendChild(n);
}

// ---- PNG export: redraw the tiles, route, markers and labels on a canvas at 2× ----
function px(mm){ return mm * 96 / 25.4; }
async function savePng(){
  const poster = $('poster'), mapEl = $('map');
  const prect = poster.getBoundingClientRect(), mrect = mapEl.getBoundingClientRect();
  const S = 2;
  const cv = document.createElement('canvas'); cv.width = Math.round(prect.width*S); cv.height = Math.round(prect.height*S);
  const ctx = cv.getContext('2d'); ctx.scale(S, S);
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, prect.width, prect.height);
  const ox = mrect.left - prect.left, oy = mrect.top - prect.top;
  // tiles
  ctx.save(); ctx.beginPath(); ctx.rect(ox, oy, mrect.width, mrect.height); ctx.clip();
  ctx.fillStyle = '#eef'; ctx.fillRect(ox, oy, mrect.width, mrect.height);
  let tainted = false;
  for (const img of mapEl.querySelectorAll('img.leaflet-tile-loaded')){
    const r = img.getBoundingClientRect();
    try { ctx.drawImage(img, r.left - prect.left, r.top - prect.top, r.width, r.height); } catch(e){ tainted = true; }
  }
  const P = (ll) => { const p = map.latLngToContainerPoint(ll); return [ox + p.x, oy + p.y]; };
  const line = (pts, style) => { ctx.beginPath(); pts.forEach((ll, k) => { const [x,y] = P(ll); k ? ctx.lineTo(x,y) : ctx.moveTo(x,y); }); Object.assign(ctx, style); ctx.setLineDash(style.dash || []); ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.stroke(); ctx.setLineDash([]); };
  line(W.route, {strokeStyle:'rgba(255,255,255,.6)', lineWidth:8});
  line(W.route, {strokeStyle:'rgba(232,89,12,.9)', lineWidth:4});
  for (const [i,j] of W.bridges) line([W.route[i], W.route[j]], {strokeStyle:'#7c3aed', lineWidth:4, dash:[6,6]});
  for (const ex of W.extras) line(ex.coords, {strokeStyle:'#4b5563', lineWidth:3, dash:[4,8]});
  const fontPx = px(2.8);
  const box = (x, y, text, sub) => {
    ctx.font = '700 ' + fontPx + 'px -apple-system, Helvetica, Arial, sans-serif';
    const w1 = ctx.measureText(text).width; ctx.font = '600 ' + fontPx*0.9 + 'px -apple-system, Helvetica, Arial, sans-serif'; const w2 = ctx.measureText(sub).width;
    const w = w1 + w2 + px(4), h = fontPx*1.5;
    ctx.fillStyle = 'rgba(255,255,255,.95)'; ctx.strokeStyle = '#111'; ctx.lineWidth = .8;
    ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x, y - h/2, w, h, 3) : ctx.rect(x, y - h/2, w, h); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#111'; ctx.font = '700 ' + fontPx + 'px -apple-system, Helvetica, Arial, sans-serif'; ctx.textBaseline = 'middle'; ctx.fillText(text, x + px(1.2), y);
    ctx.fillStyle = '#333'; ctx.font = '600 ' + fontPx*0.9 + 'px -apple-system, Helvetica, Arial, sans-serif'; ctx.fillText(sub, x + px(1.2) + w1 + px(1.2), y);
    return [w, h];
  };
  const labels = $('showLabels').checked;
  for (const p of W.pois){ const [x,y] = P([p.lat,p.lng]); ctx.fillStyle = '#fff'; ctx.strokeStyle = '#0891b2'; ctx.lineWidth = 1.5; ctx.fillRect(x-8, y-8, 16, 16); ctx.strokeRect(x-8, y-8, 16, 16); ctx.fillStyle = '#0e7490'; ctx.font = '700 9px Helvetica, Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(p.kind === 'toilet' ? 'WC' : '◉', x, y); ctx.textAlign = 'left'; }
  for (const lm of W.landmarks){ const [x,y] = P([lm.lat,lm.lng]); ctx.fillStyle = '#fff'; ctx.strokeStyle = '#374151'; ctx.lineWidth = 1.5; ctx.fillRect(x-9, y-9, 18, 18); ctx.strokeRect(x-9, y-9, 18, 18); ctx.fillStyle = '#374151'; ctx.font = '700 11px Helvetica, Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('S', x, y); ctx.textAlign = 'left'; if (labels){ ctx.font = '700 ' + fontPx*0.9 + 'px Helvetica, Arial'; const w = ctx.measureText(lm.label).width + px(2.4); ctx.fillStyle = 'rgba(255,255,255,.95)'; ctx.fillRect(x - w/2, y + 11, w, fontPx*1.3); ctx.strokeRect(x - w/2, y + 11, w, fontPx*1.3); ctx.fillStyle = '#111'; ctx.textBaseline = 'top'; ctx.fillText(lm.label, x - w/2 + px(1.2), y + 12); } }
  W.milestones.forEach((m, i) => {
    const [x,y] = P([m.lat,m.lng]); const r = px(2.6);
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2); ctx.fillStyle = m.finish ? '#111' : '#fff'; ctx.fill(); ctx.lineWidth = px(.55); ctx.strokeStyle = m.finish ? '#fff' : '#e8590c'; ctx.stroke();
    ctx.fillStyle = m.finish ? '#fff' : '#111'; ctx.font = '800 ' + px(2.9) + 'px -apple-system, Helvetica, Arial, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(m.finish ? '⛺' : String(i), x, y + 0.5); ctx.textAlign = 'left';
    if (!labels) return;
    const d = labelDir(i), t = labelText(i), text = t.n + ' ' + t.name, sub = t.time;
    ctx.font = '700 ' + fontPx + 'px -apple-system, Helvetica, Arial, sans-serif'; const w1 = ctx.measureText(text).width; ctx.font = '600 ' + fontPx*0.9 + 'px -apple-system, Helvetica, Arial, sans-serif'; const w = w1 + ctx.measureText(sub).width + px(4), h = fontPx*1.5;
    const gap = r + 3;
    let lx = x + gap, ly = y;
    if (d === 'left') lx = x - gap - w; else if (d === 'top'){ lx = x - w/2; ly = y - gap - h/2; } else if (d === 'bottom'){ lx = x - w/2; ly = y + gap + h/2; }
    box(lx, ly, text, sub);
  });
  ctx.restore();
  // header + side, as text
  ctx.fillStyle = '#111'; ctx.textBaseline = 'alphabetic';
  ctx.font = '800 ' + px(9) + 'px -apple-system, Helvetica, Arial, sans-serif'; ctx.fillText(W.title, px(6), px(11));
  ctx.font = '400 ' + px(4) + 'px -apple-system, Helvetica, Arial, sans-serif'; ctx.fillStyle = '#333'; ctx.fillText(W.subtitle + ' · ' + fmtKm(TOTAL), px(6) + ctx.measureText(W.title).width * 2.3 + px(5), px(11));
  const facts = 'Leave ' + fmtOffset(0) + ' · due at ' + FINAL.label + ' ' + fmtOffset(FINAL.offset) + (W.deadline ? ' · be there by ' + fmtClock(W.deadline) : ' · ' + W.bufferMin + ' min buffer');
  ctx.font = '600 ' + px(3.6) + 'px -apple-system, Helvetica, Arial, sans-serif'; ctx.textAlign = 'right'; ctx.fillText(facts, prect.width - px(6), px(8.5));
  ctx.font = '400 ' + px(2.8) + 'px -apple-system, Helvetica, Arial, sans-serif'; ctx.fillText('Map: ' + ATTR[$('layer').value], prect.width - px(6), px(12.5)); ctx.textAlign = 'left';
  ctx.fillStyle = '#111'; ctx.fillRect(0, oy - 1, prect.width, 1.2);
  if ($('showSide').checked){
    const side = $('side'), srect = side.getBoundingClientRect();
    const sx = srect.left - prect.left, sy = srect.top - prect.top;
    if (!poster.classList.contains('portrait')) ctx.fillRect(sx, sy, 1, srect.height);
    let y = sy + px(5), rowH = px(5.6), col = 0;
    const colW = poster.classList.contains('portrait') ? srect.width / 2 : srect.width;
    const nRows = W.milestones.length, perCol = poster.classList.contains('portrait') ? Math.ceil(nRows/2) : nRows;
    W.milestones.forEach((m, i) => {
      if (i === perCol && poster.classList.contains('portrait')){ col = 1; y = sy + px(5); }
      const x0 = sx + px(3) + col*colW;
      ctx.fillStyle = '#e8590c'; ctx.font = '800 ' + px(2.9) + 'px -apple-system, Helvetica, Arial, sans-serif'; ctx.textAlign = 'right'; ctx.fillText(m.finish ? '⛺' : String(i), x0 + px(6), y); ctx.textAlign = 'left';
      ctx.fillStyle = '#111'; ctx.font = '400 ' + px(2.9) + 'px -apple-system, Helvetica, Arial, sans-serif'; ctx.fillText(m.label, x0 + px(8), y);
      ctx.textAlign = 'right'; ctx.fillText(fmtOffset(m.offset), x0 + colW - px(4), y); ctx.textAlign = 'left';
      const sub = [m.legNote, m.break ? m.break + ' min' + (m.note ? ' — ' + m.note : '') : m.note].filter(Boolean).join(' · ');
      if (sub){ ctx.fillStyle = '#666'; ctx.font = '400 ' + px(2.3) + 'px -apple-system, Helvetica, Arial, sans-serif'; ctx.fillText(sub.slice(0, 60), x0 + px(8), y + px(2.8)); }
      y += rowH;
    });
  }
  if (tainted){ alert('The map tiles could not be copied into the image (the tile server blocks it). Use Print / Save as PDF instead.'); return; }
  cv.toBlob((blob) => {
    if (!blob){ alert('Could not make the image. Use Print / Save as PDF instead.'); return; }
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = W.slug + '_map.png'; document.body.appendChild(a); a.click(); a.remove();
  }, 'image/png');
}
['size','orient','layer','showSide','showLabels'].forEach(id => $(id).onchange = build);

// ---- printing: Chrome drops Leaflet's transformed tile layers from the print output, so just before
// printing every map's loaded tiles are copied onto a plain canvas that sits under the route and labels.
function snapshotTiles(mapEl){
  if (mapEl.querySelector('canvas.print-snapshot')) return;
  const mrect = mapEl.getBoundingClientRect(); if (!mrect.width) return;
  const S = 2;
  const cv = document.createElement('canvas'); cv.width = Math.round(mrect.width*S); cv.height = Math.round(mrect.height*S);
  cv.className = 'print-snapshot';
  cv.style.cssText = 'position:absolute;left:0;top:0;width:' + mrect.width + 'px;height:' + mrect.height + 'px;z-index:150;pointer-events:none';
  const ctx = cv.getContext('2d'); ctx.scale(S, S);
  ctx.fillStyle = '#eef'; ctx.fillRect(0, 0, mrect.width, mrect.height);
  for (const img of mapEl.querySelectorAll('img.leaflet-tile-loaded')){
    const r = img.getBoundingClientRect();
    try { ctx.drawImage(img, r.left - mrect.left, r.top - mrect.top, r.width, r.height); } catch(e){}
  }
  mapEl.appendChild(cv);
  const pane = mapEl.querySelector('.leaflet-tile-pane'); if (pane) pane.style.visibility = 'hidden';
}
function restoreTiles(mapEl){
  mapEl.querySelectorAll('canvas.print-snapshot').forEach(c => c.remove());
  const pane = mapEl.querySelector('.leaflet-tile-pane'); if (pane) pane.style.visibility = '';
}
const allMaps = () => document.querySelectorAll('.leaflet-container');
window.addEventListener('beforeprint', () => allMaps().forEach(snapshotTiles));
window.addEventListener('afterprint', () => allMaps().forEach(restoreTiles));
function printNow(){ allMaps().forEach(snapshotTiles); setTimeout(() => { window.print(); setTimeout(() => allMaps().forEach(restoreTiles), 1500); }, 50); }
$('print').onclick = printNow;
$('png').onclick = () => savePng().catch(e => alert('Could not make the image: ' + e.message + '. Use Print / Save as PDF instead.'));
build();
})();
</script>
